name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Analyze and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Exact versions, matching the versions the build passes with locally, so CI is reproducible.
      # -TrustRepository on each install: on a fresh runner the PSResourceGet repository store does
      # not exist yet, so Set-PSResourceRepository fails before anything is installed.
      - name: Install modules
        run: |
          $modules = [ordered]@{
              'Microsoft.Graph.Authentication' = '2.41.0'
              'Pester'                         = '5.9.1'
              'PSScriptAnalyzer'               = '1.23.0'
          }
          foreach ($name in $modules.Keys) {
              Install-PSResource -Name $name -Version $modules[$name] -Repository PSGallery -Scope CurrentUser -TrustRepository -Quiet
          }
          Get-Module -ListAvailable -Name @($modules.Keys) | Select-Object Name, Version | Format-Table

      # No tenant credentials exist in this repository or its secrets.
      # Every Graph call is mocked, so the tests run anywhere.
      - name: Analyze, test and package
        run: ./build/build.ps1 -Task Analyze, Test, Package

      - name: Job summary
        if: always()
        run: |
          $coverage = Get-Content ./build/output/coverage.txt -ErrorAction SilentlyContinue
          [xml]$results = Get-Content ./build/output/testResults.xml -ErrorAction SilentlyContinue
          $r = $results.'test-results'
          @"
          ### KRSSecOps on ${{ matrix.os }}
          | Tests | Passed | Failed | Coverage |
          | --- | --- | --- | --- |
          | $($r.total) | $([int]$r.total - [int]$r.failures - [int]$r.errors) | $($r.failures) | $coverage% |
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            build/output/testResults.xml
            build/output/coverage.xml
